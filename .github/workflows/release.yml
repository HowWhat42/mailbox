name: Release

# `pnpm release` bumps the version and pushes a vX.Y.Z tag; this builds the Windows installer
# and publishes it as a GitHub Release. Installed apps pick it up through electron-updater.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload the installer
  id-token: write # build provenance
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: pnpm check

      - name: Build
        run: pnpm build
        env:
          # Optional: without them the installed app hides "Sign in with Google".
          MAIN_VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      # One draft up front: electron-builder uploads into it instead of racing to create the
      # release (it once made two, with the files split between them). Installed apps ignore drafts.
      # The notes are this version's section of CHANGELOG.md: the app shows them before updating.
      - name: Create draft release
        shell: bash
        run: |
          node scripts/changelog.mjs notes "${GITHUB_REF_NAME#v}" > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Mailbox ${GITHUB_REF_NAME#v}" "${notes[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and upload
        run: pnpm exec electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/Mailbox-Setup-*.exe

      - name: Check and publish the release
        shell: bash
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '[.assets[].name] | join(" ")')
          for f in latest.yml "Mailbox-Setup-${GITHUB_REF_NAME#v}.exe" "Mailbox-Setup-${GITHUB_REF_NAME#v}.exe.blockmap"; do
            [[ " $assets " == *" $f "* ]] || { echo "missing $f in the release (got: $assets)" >&2; exit 1; }
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

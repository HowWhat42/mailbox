name: Release

# `pnpm release` bumps the version and pushes a vX.Y.Z tag; this builds the Windows installer, the
# macOS disk images and the Linux snap and flatpak, and publishes them as one GitHub Release.
# Installed Windows apps pick it up through electron-updater; the Mac build is unsigned and
# snap/flatpak cannot self-update, so those apps only announce it (see updater.ts).
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload the installers
  id-token: write # build provenance
  attestations: write

jobs:
  # One draft up front: both builds upload into it instead of racing to create the release
  # (electron-builder once made two, with the files split between them). Installed apps ignore drafts.
  # The notes are this version's section of CHANGELOG.md: the app shows them before updating.
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.3

      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Create draft release
        run: |
          node scripts/changelog.mjs notes "${GITHUB_REF_NAME#v}" > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Mailbox ${GITHUB_REF_NAME#v}" "${notes[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: dist/Mailbox-Setup-*.exe
          - os: macos-latest
            target: --mac
            files: dist/Mailbox-*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Build
        run: pnpm build
        env:
          # Optional: without them the installed app hides "Sign in with Google".
          MAIN_VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MAIN_VITE_MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}

      - name: Package and upload
        run: pnpm exec electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple Developer ID: the app is ad-hoc signed only (mac.identity "-").
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ matrix.files }}

  # Linux is not in the matrix: `--publish always` would send the snap to the Snap Store
  # (electron-builder's default for snaps), so the files are built locally and uploaded with gh.
  snap:
    needs: draft
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Build
        run: pnpm build
        env:
          MAIN_VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Package and upload
        run: |
          pnpm exec electron-builder --linux snap --publish never
          gh release upload "$GITHUB_REF_NAME" dist/*.snap --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.snap

  # The slowest build (~5 min: Flathub runtimes, then a single-threaded LZMA bundle), so the release
  # does not wait for it: the flatpak lands in the draft or, more often, in the published release.
  flatpak:
    needs: draft
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.3
          cache: pnpm

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          MAIN_VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Package and upload
        run: |
          pnpm exec electron-builder --linux flatpak --publish never
          gh release upload "$GITHUB_REF_NAME" dist/*.flatpak --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.flatpak

  publish:
    needs: [build, snap]
    runs-on: ubuntu-latest
    steps:
      - name: Check and publish the release
        run: |
          v="${GITHUB_REF_NAME#v}"
          assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | join(" ")')
          for f in latest.yml "Mailbox-Setup-$v.exe" "Mailbox-Setup-$v.exe.blockmap" \
            latest-mac.yml "Mailbox-$v-arm64.dmg" "Mailbox-$v-x64.dmg" "Mailbox-$v-arm64.zip" "Mailbox-$v-x64.zip" \
            "mailbox_${v}_amd64.snap"; do
            [[ " $assets " == *" $f "* ]] || { echo "missing $f in the release (got: $assets)" >&2; exit 1; }
          done
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
